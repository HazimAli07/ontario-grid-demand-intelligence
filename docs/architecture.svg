<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Ontario Grid Demand Intelligence architecture</title>
  <desc id="desc">IESO reports flow through Bronze, Silver and Gold data layers to forecasting, Databricks SQL and Streamlit outputs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0c1b2a"/><stop offset="1" stop-color="#155b58"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".22"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#93b8b1"/></marker>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <text x="60" y="62" fill="#d8ff4f" font-family="Arial" font-size="17" font-weight="700" letter-spacing="3">PIPELINE ARCHITECTURE</text>
  <text x="60" y="105" fill="white" font-family="Arial" font-size="30" font-weight="700">From public grid data to decision-ready intelligence</text>
  <g filter="url(#shadow)" font-family="Arial">
    <rect x="55" y="155" width="180" height="150" rx="18" fill="#f4f8f5"/>
    <text x="80" y="193" fill="#175950" font-size="14" font-weight="700">SOURCE</text>
    <text x="80" y="231" fill="#0c1b2a" font-size="21" font-weight="700">IESO reports</text>
    <text x="80" y="260" fill="#5c716b" font-size="14">Hourly Ontario +</text><text x="80" y="282" fill="#5c716b" font-size="14">market demand</text>
    <rect x="285" y="155" width="180" height="150" rx="18" fill="#f4f8f5"/>
    <text x="310" y="193" fill="#9a5b16" font-size="14" font-weight="700">BRONZE</text>
    <text x="310" y="231" fill="#0c1b2a" font-size="21" font-weight="700">Raw snapshot</text>
    <text x="310" y="260" fill="#5c716b" font-size="14">Source lineage +</text><text x="310" y="282" fill="#5c716b" font-size="14">reproducible ingest</text>
    <rect x="515" y="155" width="180" height="150" rx="18" fill="#f4f8f5"/>
    <text x="540" y="193" fill="#5e6e7a" font-size="14" font-weight="700">SILVER</text>
    <text x="540" y="231" fill="#0c1b2a" font-size="21" font-weight="700">Quality layer</text>
    <text x="540" y="260" fill="#5c716b" font-size="14">Typed, validated,</text><text x="540" y="282" fill="#5c716b" font-size="14">de-duplicated</text>
    <rect x="745" y="155" width="180" height="150" rx="18" fill="#f4f8f5"/>
    <text x="770" y="193" fill="#a2760e" font-size="14" font-weight="700">GOLD</text>
    <text x="770" y="231" fill="#0c1b2a" font-size="21" font-weight="700">Analytics marts</text>
    <text x="770" y="260" fill="#5c716b" font-size="14">Daily KPIs, profiles,</text><text x="770" y="282" fill="#5c716b" font-size="14">peaks + forecast</text>
    <rect x="975" y="155" width="170" height="150" rx="18" fill="#d8ff4f"/>
    <text x="1000" y="193" fill="#30400a" font-size="14" font-weight="700">CONSUMERS</text>
    <text x="1000" y="231" fill="#0c1b2a" font-size="21" font-weight="700">Insights</text>
    <text x="1000" y="260" fill="#30400a" font-size="14">Streamlit app</text><text x="1000" y="282" fill="#30400a" font-size="14">Databricks SQL</text>
  </g>
  <g stroke="#93b8b1" stroke-width="4" marker-end="url(#arrow)">
    <line x1="240" y1="230" x2="275" y2="230"/><line x1="470" y1="230" x2="505" y2="230"/>
    <line x1="700" y1="230" x2="735" y2="230"/><line x1="930" y1="230" x2="965" y2="230"/>
  </g>
  <text x="60" y="365" fill="#c5d8d4" font-family="Arial" font-size="15">Python • pandas • scikit-learn • PySpark • Delta Lake • SQL • Streamlit • Plotly</text>
</svg>

